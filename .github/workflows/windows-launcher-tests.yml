name: Windows launcher tests

on:
  push:
    paths:
      - '*.bat'
      - 'scripts/**'
      - '.github/workflows/windows-launcher-tests.yml'
  pull_request:
    paths:
      - '*.bat'
      - 'scripts/**'
      - '.github/workflows/windows-launcher-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install launcher test dependencies
        run: python -m pip install "psycopg[binary]==3.2.9" "sqlalchemy==2.0.43"
      - name: Test Windows setup and recovery
        run: python -m unittest discover -s scripts/tests -p "test_windows*.py" -v
